pre-commit:
  piped: true
  commands:
    format:
      priority: 1
      run: just format
    lint-fix:
      priority: 2
      run: just lint-fix
    lint:
      priority: 3
      run: just lint
    check-modified:
      priority: 4
      run: git diff --exit-code || { echo "Auto-fixes were applied. Stage the changes and re-commit."; exit 1; }

pre-push:
  commands:
    format:
      run: just format-check
    lint:
      run: just lint
    test:
      run: just test
