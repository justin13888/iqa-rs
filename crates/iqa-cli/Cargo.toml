[package]
name = "iqa-cli"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Command-line front-end to the iqa crate: compute image-quality metrics between two images and emit them as JSON."
license = "MIT OR Apache-2.0"
repository = "https://github.com/visualcommons/iqa-rs"
keywords = ["iqa", "image-quality", "ssim", "psnr", "cli"]
categories = ["multimedia::images", "command-line-utilities"]

[[bin]]
name = "iqa-cli"
path = "src/main.rs"

[dependencies]
# All metric math comes from the iqa crate; this CLI only decodes inputs and
# serializes results. iqa's default features enable PSNR, SSIM, SSIMULACRA2 and
# Butteraugli, and build lcms2 from source (vendored-lcms2) — so no system
# lcms2 is required. The path/version come from `[workspace.dependencies]` in the
# root Cargo.toml, which is the single place to bump the published version.
iqa = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
# Decodes reference/distorted images (PNG/JPEG/PPM) into raw RGB8 buffers, the
# input iqa expects. iqa deliberately does not decode image formats.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "pnm",
] }
