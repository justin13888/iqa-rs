name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install lcms2
        run: sudo apt-get update && sudo apt-get install -y liblcms2-dev
      - name: Format check
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --no-default-features --features full,vendored-lcms2 -- -D warnings
      - name: Test (vendored lcms2 backend)
        run: cargo test --no-default-features --features full,vendored-lcms2
      - name: Test (system lcms2 backend)
        run: cargo test --no-default-features --features full,system-lcms2
      # iqa-cli is a separate workspace member; bare cargo above targets only the
      # root `iqa` package, so lint and test it explicitly. It builds `iqa` with
      # default features (vendored lcms2), so it needs the submodules above.
      - name: Lint iqa-cli
        run: cargo clippy -p iqa-cli --all-targets -- -D warnings
      - name: Test iqa-cli
        run: cargo test -p iqa-cli

  minimal:
    name: Test (pure-Rust subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --no-default-features --features psnr

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install lcms2
        run: sudo apt-get update && sudo apt-get install -y liblcms2-dev
      - name: Generate coverage report
        run: cargo llvm-cov --no-default-features --features psnr,ssim,dssim,ms-ssim,psnr-hvs-m,ssimulacra2,butteraugli,vendored-lcms2 --lcov --output-path lcov.info
      - name: Generate coverage summary
        run: cargo llvm-cov --no-default-features --features psnr,ssim,dssim,ms-ssim,psnr-hvs-m,ssimulacra2,butteraugli,vendored-lcms2 report --summary-only
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
